name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (core + pytest, the GUI is not needed in CI)
        run: python -m pip install -e . pytest
      - name: Run tests
        run: pytest -q
      - name: CLI smoke test
        shell: bash
        run: |
          desktop-cleaner --version
          desktop-cleaner --json preview > /dev/null

  lint:
    name: ruff
    runs-on: ubuntu-latest
    # Advisory until the ruff adoption pull request lands (it removes this line and makes lint blocking).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check desktop_cleaner tests docs

  web:
    name: front-end syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node --check desktop_cleaner/gui/web/app.js
      - run: node --check desktop_cleaner/gui/web/space.js
